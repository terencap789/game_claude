<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morpion · Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>:root{--accent:var(--ttt);}</style>
</head>
<body>
<div class="topbar"><a class="backBtn" href="index.html">← Menu</a><div class="gameTitle">✕⭕ Morpion</div></div>
<main>

  <section class="startScreen" id="startScreen">
    <div class="optionGroup">
      <span class="label">Adversaire</span>
      <div class="optionRow" id="modeRow">
        <button class="optBtn selected" data-mode="human">Deux joueurs</button>
        <button class="optBtn" data-mode="bot">Contre le robot</button>
      </div>
    </div>
    <div class="optionGroup">
      <span class="label">Taille de la grille</span>
      <div class="optionRow" id="sizeRow">
        <button class="optBtn selected" data-size="3">3×3</button>
        <button class="optBtn" data-size="4">4×4</button>
        <button class="optBtn" data-size="5">5×5</button>
        <button class="optBtn" data-size="6">6×6</button>
      </div>
    </div>
    <button class="actionBtn" id="startBtn">Commencer</button>
  </section>

  <section id="gameScreen" style="display:none; width:100%; align-items:center; flex-direction:column; gap:18px;">
    <div class="statusRow">
      <div class="pill" id="tttStatus"></div>
      <button class="actionBtn" id="tttReset">Changer de partie</button>
    </div>
    <div class="tttGrid" id="tttGrid"></div>
  </section>

</main>
<script src="morpion.js"></script>
</body>
</html>
