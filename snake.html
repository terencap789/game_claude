<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake · Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>:root{--accent:var(--snake);}</style>
</head>
<body>
<div class="topbar"><a class="backBtn" href="index.html">← Menu</a><div class="gameTitle">🐍 Snake</div></div>
<main>
  <div class="statusRow">
    <div class="pill">Score <strong id="snakeScore">0</strong></div>
    <div class="pill">Record <strong id="snakeHigh">0</strong></div>
    <button class="actionBtn" id="snakeStart">Jouer</button>
  </div>
  <canvas id="snakeCanvas" width="420" height="420"></canvas>
  <div class="padWrap">
    <span class="padEmpty"></span><button data-d="up">▲</button><span class="padEmpty"></span>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
</main>
<footer class="hint">Flèches / WASD pour jouer · Échap pour mettre en pause</footer>
<script src="snake.js"></script>
</body>
</html>
