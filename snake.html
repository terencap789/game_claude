<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake · Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>:root{--accent:var(--snake);}</style>
</head>
<body>
<div class="topbar"><a class="backBtn" href="index.html">← Menu</a><div class="gameTitle">🐍 Snake</div></div>
<main>
  <div class="statusRow">
    <div class="pill">Score <strong id="score">0</strong></div>
    <div class="pill">Record <strong id="highScore">0</strong></div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" class="gameCanvas" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <div class="overlay-content">
        <div id="overlayIcon" class="overlay-icon">🐍</div>
        <h2 id="overlayTitle">Snake</h2>
        <p id="overlayText">Utilise les flèches, WASD ou les boutons pour commencer.</p>
        <button class="actionBtn" id="startButton">Jouer</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control empty" aria-hidden="true"></button>
    <button class="control" data-direction="up" aria-label="Haut">▲</button>
    <button class="control empty" aria-hidden="true"></button>
    <button class="control" data-direction="left" aria-label="Gauche">◀</button>
    <button class="control" data-direction="down" aria-label="Bas">▼</button>
    <button class="control" data-direction="right" aria-label="Droite">▶</button>
  </div>
</main>
<footer class="hint">Flèches / WASD pour jouer · Échap pour mettre en pause</footer>
<script src="snake.js"></script>
</body>
</html>
